<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Marie &mdash; intro</title>
<style>
 *{box-sizing:border-box} html,body{margin:0;height:100%;background:#000;overflow:hidden}
 body{font-family:"Iowan Old Style",Palatino,Georgia,serif;touch-action:none;cursor:grab}
 body.tapped{cursor:default}
 canvas{display:block;position:fixed;inset:0}
 #hint{position:fixed;left:0;right:0;bottom:13vh;text-align:center;z-index:4;color:#9a9188;
  font-size:clamp(13px,1.7vw,18px);letter-spacing:.2em;opacity:0;transition:opacity 1.2s ease;
  pointer-events:none;text-transform:uppercase}
 #hint.in{opacity:.8}
 .hud{position:fixed;left:14px;top:12px;z-index:3;color:#544d42;font-size:11px;line-height:1.75;
  font-family:ui-monospace,Menlo,monospace} .hud b{color:#8d7f5c;font-weight:400}
 #tl{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:9;display:flex;gap:9px;
  align-items:center;background:rgba(9,8,5,.9);border:1px solid #2b2419;border-radius:9px;
  padding:9px 13px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#c9a24e}
 #tl button{font:inherit;background:#171208;color:#c9a24e;border:1px solid #3d3524;border-radius:5px;
  padding:5px 9px;cursor:pointer} #tl button:hover{border-color:#c9a24e}
 #tl input{width:min(320px,42vw);accent-color:#c9a24e} #tn{min-width:78px}
 #tl.hide{display:none}
 #reveal{position:fixed;inset:0;z-index:2;opacity:0;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 72% 62% at 50% 56%,#3d2c18 0%,#1e1409 46%,#080503 79%,#000 100%)}
 #rtitle{font-size:clamp(30px,6.4vw,74px);color:#f2e4c6;letter-spacing:.015em;
  text-shadow:0 0 46px rgba(201,162,78,.42)}
 #rsub{margin-top:.7em;font-family:ui-monospace,Menlo,monospace;font-size:11px;
  letter-spacing:.34em;color:#9d8657;text-transform:uppercase}
 @media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style></head><body>
<div class="hud" id="hud">loading&hellip;</div>
<div id="reveal"><div id="rtitle">Abby&rsquo;s Museum</div><div id="rsub">est. 2026 &middot; Chicago</div></div>
<div id="hint">tap to shatter</div>
<div id="tl"><button id="pp">replay</button><span id="tn">0.00s</span>
<input type="range" id="sc" min="0" max="500" step="1" value="0"><button id="hd">hide</button></div>
<script type="importmap">
{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../vendor/loaders/GLTFLoader.js';
import { DRACOLoader } from '../vendor/loaders/DRACOLoader.js';

// camera, lights, material and 1:1 playback are copied from the sim viewer so
// the frame at impact is identical to it. the only addition is the drop.
const R=new THREE.WebGLRenderer({antialias:true}); R.setPixelRatio(Math.min(devicePixelRatio,2));
R.setSize(innerWidth,innerHeight); R.setClearColor(0x000000,1);
R.toneMapping=THREE.ACESFilmicToneMapping; document.body.appendChild(R.domElement);

const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.02,80); cam.position.set(0,0.72,3.95);
scene.add(new THREE.AmbientLight(0x33343a,0.75));
const key=new THREE.DirectionalLight(0xfff8ef,2.4); key.position.set(-1.4,1.2,1.6); scene.add(key);
const fill=new THREE.DirectionalLight(0xd8e4ff,0.5); fill.position.set(1.6,0.2,1.0); scene.add(fill);
const rim=new THREE.DirectionalLight(0xfff2dd,1.3); rim.position.set(0.8,0.9,-1.7); scene.add(rim);
const marble=new THREE.MeshStandardMaterial({color:0xdcd8d1,roughness:0.47,
  vertexColors:true});   // baked AO + dust buildup ride in the mesh

function radial(stops){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const g=c.getContext('2d'), rg=g.createRadialGradient(128,128,0,128,128,128);
  for(const [o,col] of stops) rg.addColorStop(o,col);
  g.fillStyle=rg; g.fillRect(0,0,256,256); return new THREE.CanvasTexture(c);
}
// untextured points draw as hard squares. a single clean radial also reads as
// fog, so each puff is several offset blobs: irregular edges, like real dust.
const DUST_RGB=[140,122,97];            // = #8C7A61, the baked surface dust
function puff(){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const g=c.getContext('2d');
  for(let i=0;i<7;i++){
    const px=128+(Math.random()-0.5)*96, py=128+(Math.random()-0.5)*96,
          pr=44+Math.random()*74;
    const rg=g.createRadialGradient(px,py,0,px,py,pr);
    const [r,g_,b]=DUST_RGB;
    rg.addColorStop(0,   `rgba(${r+26},${g_+24},${b+21},0.30)`);
    rg.addColorStop(0.45,`rgba(${r},${g_},${b},0.13)`);
    rg.addColorStop(1,   `rgba(${r-16},${g_-16},${b-14},0)`);
    g.fillStyle=rg; g.beginPath(); g.arc(px,py,pr,0,6.2832); g.fill();
  }
  return new THREE.CanvasTexture(c);
}
const dustTex=puff();
const DUST=4200, dPos=new Float32Array(DUST*3), dVel=new Float32Array(DUST*3),
      dSeed=new Float32Array(DUST), dScale=new Float32Array(DUST);
for(let i=0;i<DUST;i++){
  const a=Math.random()*Math.PI*2, r=Math.pow(Math.random(),0.45)*0.36;
  dPos[i*3]=Math.cos(a)*r; dPos[i*3+1]=Math.random()*0.06; dPos[i*3+2]=Math.sin(a)*r;
  // three populations: a low fast skirt, a slow billowing body, and a set that
  // rolls straight at the lens. the mix is what makes it read as volume.
  const kind=i%10;
  let sp,lift,toward;
  if(kind<4){      sp=1.7+Math.random()*2.6; lift=0.30+Math.random()*0.7;  toward=0.2; }
  else if(kind<8){ sp=0.7+Math.random()*1.5; lift=0.95+Math.random()*1.9;  toward=0.3; }
  else {           sp=0.5+Math.random()*1.0; lift=0.55+Math.random()*1.2;  toward=2.4; }
  dVel[i*3]=Math.cos(a)*sp;
  dVel[i*3+1]=lift;
  dVel[i*3+2]=Math.sin(a)*sp+toward*(0.6+Math.random());
  dSeed[i]=Math.random()*6.283;
  dScale[i]=(kind<4?0.5:kind<8?1.5:2.6)*(0.55+Math.random()*1.5);
}
const dGeo=new THREE.BufferGeometry();
dGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(DUST*3),3));
const dMat=new THREE.PointsMaterial({map:dustTex,transparent:true,depthWrite:false,
  size:0.42,sizeAttenuation:true,opacity:0,color:0x8c7a61});  // same dust as the marble
const dust=new THREE.Points(dGeo,dMat); dust.frustumCulled=false; scene.add(dust);

const T_EASE=0.34, T_FALL=0.46, T_IMPACT=T_EASE+T_FALL, DUR=5.0;
const DROP=1.05;                    // she falls this far. the camera never moves.
const easeOut=x=>1-Math.pow(1-x,3), easeIn=x=>x*x;

let intact=null, shards=null, mixer=null, simDur=1, baseY=0;
let state='IDLE', t=0, dragAmt=0, spin=0;

const draco=new DRACOLoader(); draco.setDecoderPath('../vendor/draco/');
const L=new GLTFLoader(); L.setDRACOLoader(draco);
const hud=document.getElementById('hud');

L.load('../sim/sim.glb',(s)=>{
  shards=s.scene; shards.visible=false; scene.add(shards);
  let n=0; shards.traverse(o=>{ if(o.isMesh){ o.material=marble; n++; } });
  const sb=new THREE.Box3().setFromObject(shards), c=new THREE.Vector3(); sb.getCenter(c);
  baseY=sb.min.y; cam.lookAt(0,c.y,0); dust.position.y=baseY;
  mixer=new THREE.AnimationMixer(shards); simDur=0;
  for(const cl of s.animations){ const a=mixer.clipAction(cl);
    a.loop=THREE.LoopOnce; a.clampWhenFinished=true; a.play(); simDur=Math.max(simDur,cl.duration); }

  L.load('../marie.glb',(g)=>{
    const b=new THREE.Box3().setFromObject(g.scene), ic=new THREE.Vector3(); b.getCenter(ic);
    g.scene.position.sub(ic);
    intact=new THREE.Group(); intact.add(g.scene);
    intact.scale.setScalar((sb.max.y-sb.min.y)/(b.max.y-b.min.y));
    g.scene.position.y+=(ic.y-b.min.y);
    intact.traverse(o=>{ if(o.isMesh) o.material=marble; });
    scene.add(intact);
    hud.innerHTML='<b>shards</b> '+n+'<br><b>dust</b> '+DUST+'<br><b>drop</b> '+
      T_IMPACT.toFixed(2)+'s<br><b>fps</b> <span id="fps">--</span>';
    document.getElementById('hint').classList.add('in');
    sync();
  });
},undefined,(e)=>{hud.textContent='FAILED '+e;});

function sync(){
  const impacted = state!=='IDLE' && t>=T_IMPACT;
  const ta = Math.max(0,t-T_IMPACT);

  let lift=DROP, rot=spin;
  if(state==='IDLE') lift=DROP;
  else if(!impacted){
    if(t<T_EASE){ const k=easeOut(t/T_EASE); lift=DROP+k*0.10; rot=spin+k*0.04; }
    else { const k=easeIn((t-T_EASE)/T_FALL); lift=(DROP+0.10)*(1-k); rot=spin+0.04+k*0.10; }
  } else lift=0;

  if(intact){ intact.position.y=baseY+lift; intact.rotation.y=rot; intact.visible=!impacted; }
  if(shards){ shards.visible=impacted; shards.rotation.y=rot; }

  // the bake plays straight, exactly as it does in the sim viewer
  if(mixer && impacted) mixer.setTime(Math.min(ta,simDur));

  if(impacted){
    const arr=dGeo.attributes.position.array;
    const drag=1-Math.exp(-ta*0.95);          // billows hard, then stalls and hangs
    for(let i=0;i<DUST;i++){
      const sw=Math.sin(dSeed[i]+ta*1.15), sw2=Math.cos(dSeed[i]*1.7+ta*0.85);
      arr[i*3]  =dPos[i*3]  +dVel[i*3]  *drag*1.25+sw*0.14*ta;
      arr[i*3+1]=Math.max(0.004,dPos[i*3+1]+dVel[i*3+1]*drag*0.95
                 -0.06*ta*ta+sw2*0.11*ta);
      arr[i*3+2]=dPos[i*3+2]+dVel[i*3+2]*drag*1.25+sw2*0.12*ta;
    }
    dGeo.attributes.position.needsUpdate=true;
    dMat.size=0.42+ta*0.95;
    dMat.opacity=Math.min(0.62,ta*1.15)*Math.max(0,1-Math.pow(Math.max(0,ta-2.2)/1.5,1.6));
  } else dMat.opacity=0;

  const rv=document.getElementById('reveal');
  if(rv) rv.style.opacity = impacted ? Math.max(0,Math.min(1,(ta-1.25)/0.9)).toFixed(3) : '0';

  document.getElementById('tn').textContent=t.toFixed(2)+'s';
  document.getElementById('sc').value=Math.round(t/DUR*500);
}

let dragging=false,lx=0,tDown=0;
addEventListener('pointerdown',e=>{ if(e.target.closest('#tl')) return;
  dragging=true; lx=e.clientX; dragAmt=0; tDown=performance.now();
  try{R.domElement.setPointerCapture(e.pointerId);}catch(_){} });
addEventListener('pointermove',e=>{ if(!dragging) return;
  const dx=e.clientX-lx; lx=e.clientX; dragAmt+=Math.abs(dx);
  if(state==='IDLE') spin+=dx*0.006; });
addEventListener('pointerup',e=>{ if(!dragging) return; dragging=false;
  if(e.target.closest('#tl')) return;
  const quick=performance.now()-tDown<400;
  if((dragAmt<14||quick) && state==='IDLE' && shards){ state='RUN'; t=0;
    document.body.classList.add('tapped');
    document.getElementById('hint').classList.remove('in'); } });
document.getElementById('pp').addEventListener('click',()=>{ if(shards){state='RUN'; t=0;} });
document.getElementById('sc').addEventListener('input',e=>{ if(!shards) return;
  state='SCRUB'; t=+e.target.value/500*DUR;
  document.getElementById('hint').classList.remove('in'); sync(); });
document.getElementById('hd').addEventListener('click',()=>{
  document.getElementById('tl').classList.toggle('hide'); });
const qt=new URLSearchParams(location.search).get('t');
if(qt!==null){ state='SCRUB'; t=Math.max(0,Math.min(DUR,+qt)); }

let f=0,last=performance.now(); const clock=new THREE.Clock();
(function tick(){ requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05);
  if(state==='RUN'){ t+=dt; if(t>=DUR){ t=DUR; state='DONE'; } sync(); }
  if(state==='IDLE'){ if(!dragging) spin+=dt*0.12; sync(); }
  R.render(scene,cam);
  f++; const p=performance.now();
  if(p-last>1000){ const el=document.getElementById('fps');
    if(el) el.textContent=Math.round(f*1000/(p-last)); f=0; last=p; } })();
addEventListener('resize',()=>{ cam.aspect=innerWidth/innerHeight;
  cam.updateProjectionMatrix(); R.setSize(innerWidth,innerHeight); });
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Marie &mdash; intro</title>
<style>
 *{box-sizing:border-box} html,body{margin:0;height:100%;background:#000;overflow:hidden}
 body{font-family:"Iowan Old Style",Palatino,Georgia,serif;touch-action:none;cursor:grab}
 body.tapped{cursor:default}
 canvas{display:block;position:fixed;inset:0}
 #hint{position:fixed;left:0;right:0;bottom:13vh;text-align:center;z-index:4;color:#9a9188;
  font-size:clamp(13px,1.7vw,18px);letter-spacing:.2em;opacity:0;transition:opacity 1.2s ease;
  pointer-events:none;text-transform:uppercase}
 #hint.in{opacity:.8}
 .hud{position:fixed;left:14px;top:12px;z-index:3;color:#544d42;font-size:11px;line-height:1.75;
  font-family:ui-monospace,Menlo,monospace} .hud b{color:#8d7f5c;font-weight:400}
 #tl{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:9;display:flex;gap:9px;
  align-items:center;background:rgba(9,8,5,.9);border:1px solid #2b2419;border-radius:9px;
  padding:9px 13px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#c9a24e}
 #tl button{font:inherit;background:#171208;color:#c9a24e;border:1px solid #3d3524;border-radius:5px;
  padding:5px 9px;cursor:pointer} #tl button:hover{border-color:#c9a24e}
 #tl input{width:min(320px,42vw);accent-color:#c9a24e} #tn{min-width:78px}
 #tl.hide{display:none}
 #reveal{position:fixed;inset:0;z-index:2;opacity:0;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 72% 62% at 50% 56%,#3d2c18 0%,#1e1409 46%,#080503 79%,#000 100%)}
 #rtitle{font-size:clamp(30px,6.4vw,74px);color:#f2e4c6;letter-spacing:.015em;
  text-shadow:0 0 46px rgba(201,162,78,.42)}
 #rsub{margin-top:.7em;font-family:ui-monospace,Menlo,monospace;font-size:11px;
  letter-spacing:.34em;color:#9d8657;text-transform:uppercase}
 @media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style></head><body>
<div class="hud" id="hud">loading&hellip;</div>
<div id="reveal"><div id="rtitle">Abby&rsquo;s Museum</div><div id="rsub">est. 2026 &middot; Chicago</div></div>
<div id="hint">tap to shatter</div>
<div id="tl"><button id="pp">replay</button><span id="tn">0.00s</span>
<input type="range" id="sc" min="0" max="500" step="1" value="0"><button id="hd">hide</button></div>
<script type="importmap">
{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../vendor/loaders/GLTFLoader.js';
import { DRACOLoader } from '../vendor/loaders/DRACOLoader.js';

// camera, lights, material and 1:1 playback are copied from the sim viewer so
// the frame at impact is identical to it. the only addition is the drop.
const R=new THREE.WebGLRenderer({antialias:true}); let DPR=Math.min(devicePixelRatio,2); R.setPixelRatio(DPR);
R.setSize(innerWidth,innerHeight); R.setClearColor(0x000000,1);
R.toneMapping=THREE.ACESFilmicToneMapping; document.body.appendChild(R.domElement);

const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.02,80); cam.position.set(0,0.95,4.75);
scene.add(new THREE.AmbientLight(0x33343a,0.75));
const key=new THREE.DirectionalLight(0xfff8ef,2.4); key.position.set(-1.4,1.2,1.6); scene.add(key);
const fill=new THREE.DirectionalLight(0xd8e4ff,0.5); fill.position.set(1.6,0.2,1.0); scene.add(fill);
const rim=new THREE.DirectionalLight(0xfff2dd,1.3); rim.position.set(0.8,0.9,-1.7); scene.add(rim);
const marble=new THREE.MeshStandardMaterial({color:0xdcd8d1,roughness:0.47,
  vertexColors:true});   // baked AO + dust buildup ride in the mesh

function radial(stops){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const g=c.getContext('2d'), rg=g.createRadialGradient(128,128,0,128,128,128);
  for(const [o,col] of stops) rg.addColorStop(o,col);
  g.fillStyle=rg; g.fillRect(0,0,256,256); return new THREE.CanvasTexture(c);
}
// untextured points draw as hard squares. a single clean radial also reads as
// fog, so each puff is several offset blobs: irregular edges, like real dust.
const DUST_RGB=[196,189,176];           // warm light grey, off pure white
// stacked radial gradients are always a circle, however they are blurred or
// rotated, and repeated circles read as snowballs. real smoke is fractal
// noise with a ragged silhouette, so generate actual fBm and carve the alpha
// out of it. 2x2 atlas of independent seeds, picked per particle.
function fbmAtlas(){
  const N=256, H=N>>1;
  const c=document.createElement('canvas'); c.width=c.height=N;
  const g=c.getContext('2d'), img=g.createImageData(N,N), d=img.data;
  const [R,G,B]=DUST_RGB;
  const hash=(x,y,s)=>{ let n=(x|0)*374761393+(y|0)*668265263+(s|0)*1442695040;
    n=Math.imul(n^(n>>>13),1274126177); return ((n^(n>>>16))>>>0)/4294967295; };
  function vn(x,y,s){
    const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
    return hash(xi,yi,s)*(1-u)*(1-v) + hash(xi+1,yi,s)*u*(1-v)
         + hash(xi,yi+1,s)*(1-u)*v   + hash(xi+1,yi+1,s)*u*v;
  }
  function fbm(x,y,s){
    let v=0,a=0.5,f=1;
    for(let o=0;o<5;o++){ v+=a*vn(x*f,y*f,s+o*17); f*=2.07; a*=0.5; }
    return v;
  }
  for(let q=0;q<4;q++){
    const ox=(q&1)*H, oy=(q>>1)*H, seed=q*911+7;
    for(let y=0;y<H;y++) for(let x=0;x<H;x++){
      const nx=x/H, ny=y/H;
      // warp the lookup so the shape is ragged, never a disc
      const wx=nx*4.0 + fbm(nx*3.1,ny*3.1,seed+51)*1.4;
      const wy=ny*4.0 + fbm(nx*3.1+5.2,ny*3.1+1.3,seed+77)*1.4;
      let v=fbm(wx,wy,seed);
      v=Math.min(1,Math.max(0,(v-0.34)*2.35));     // stretch: filaments, not haze
      const dx=nx-0.5, dy=ny-0.5;
      const rad=Math.sqrt(dx*dx+dy*dy)*2;
      const edge=1-Math.min(1,Math.max(0,(rad-0.30)/0.70));
      const a=v*edge*edge;
      const i=((oy+y)*N+(ox+x))*4;
      d[i]=R; d[i+1]=G; d[i+2]=B; d[i+3]=Math.min(255,a*225);
    }
  }
  g.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);
  t.minFilter=THREE.LinearFilter; t.magFilter=THREE.LinearFilter;
  return t;
}
const dustTex=fbmAtlas();

// dust is emitted continuously while the rubble keeps settling, not all at
// once. every puff gets its own birth time, so the cloud grows instead of
// appearing. that needs per-particle size and alpha, hence the shader.
const DUST=2200;     // enough overlap that no single puff is visible
const dPos=new Float32Array(DUST*3), dVel=new Float32Array(DUST*3),
      dSeed=new Float32Array(DUST), aBirth=new Float32Array(DUST),
      aSize=new Float32Array(DUST), aDirt=new Float32Array(DUST),
      aLife=new Float32Array(DUST), aRot=new Float32Array(DUST),
      aVar=new Float32Array(DUST);
for(let i=0;i<DUST;i++){
  const a=Math.random()*Math.PI*2, r=Math.pow(Math.random(),0.45)*0.36;
  dPos[i*3]=Math.cos(a)*r; dPos[i*3+1]=Math.random()*0.06; dPos[i*3+2]=Math.sin(a)*r;
  const kind=i%10;
  let sp,lift,toward;
  if(kind<4){      sp=1.5+Math.random()*2.2; lift=0.28+Math.random()*0.6; toward=0.2; }
  else if(kind<8){ sp=0.6+Math.random()*1.3; lift=0.85+Math.random()*1.7; toward=0.3; }
  else {           sp=0.45+Math.random()*0.9; lift=0.5+Math.random()*1.1; toward=2.2; }
  dVel[i*3]=Math.cos(a)*sp;
  dVel[i*3+1]=lift;
  dVel[i*3+2]=Math.sin(a)*sp+toward*(0.6+Math.random());
  dSeed[i]=Math.random()*6.283;
  // most of the cloud is thrown in the first moments, the rest keeps feeding
  aBirth[i]=Math.pow(Math.random(),2.1)*1.7 + (kind>=8?1.05:0.0);
  aLife[i]=2.2+Math.random()*2.2;
  aSize[i]=(kind<4?1.1:kind<8?2.3:3.6)*(0.55+Math.pow(Math.random(),1.5)*1.4);
  aDirt[i]=Math.random()<0.22 ? 0.72+Math.random()*0.14 : 0.94+Math.random()*0.06;
  aRot[i]=Math.random()*6.2832;
  aVar[i]=Math.floor(Math.random()*4);
}
const dGeo=new THREE.BufferGeometry();
dGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(DUST*3),3));
dGeo.setAttribute('aBirth',new THREE.BufferAttribute(aBirth,1));
dGeo.setAttribute('aSize', new THREE.BufferAttribute(aSize,1));
dGeo.setAttribute('aDirt', new THREE.BufferAttribute(aDirt,1));
dGeo.setAttribute('aLife', new THREE.BufferAttribute(aLife,1));
dGeo.setAttribute('aRot',  new THREE.BufferAttribute(aRot,1));
dGeo.setAttribute('aVar',  new THREE.BufferAttribute(aVar,1));
const dMat=new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, depthTest:true,
  uniforms:{ uTime:{value:0}, uTex:{value:dustTex}, uPix:{value:innerHeight} },
  vertexShader:`
    attribute float aBirth, aSize, aDirt, aLife, aRot, aVar;
    varying float vA; varying float vD; varying float vR; varying float vV;
    uniform float uTime, uPix;
    void main(){
      float age = uTime - aBirth;
      vV = aVar;
      vR = aRot + age * 0.22;              // each puff sits at its own angle and drifts
      vec3 Ldir = normalize(vec3(-1.4, 1.2, 1.6));      // the scene's key light
      vec3 rel  = normalize(position - vec3(0.0, 0.45, 0.0));
      float lam = dot(rel, Ldir) * 0.5 + 0.5;           // lit side vs far side
      float deep = smoothstep(-0.1, 1.9, position.y);   // low in the cloud is buried
      vD = aDirt * mix(0.26, 1.06, lam) * mix(0.48, 1.0, deep);
      if(age < 0.0){ vA = 0.0; gl_Position = vec4(2.0,2.0,2.0,1.0); gl_PointSize = 0.0; return; }
      float t = age / aLife;
      float fadeIn  = smoothstep(0.0, 0.18, t);
      float fadeOut = 1.0 - smoothstep(0.55, 1.0, t);
      vA = fadeIn * fadeOut;
      vec4 mv = modelViewMatrix * vec4(position,1.0);
      float grow = 0.45 + 0.85 * pow(t, 0.5);
      gl_PointSize = min(aSize * grow * uPix * 0.22 / max(0.001, -mv.z), 620.0);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader:`
    uniform sampler2D uTex;
    varying float vA; varying float vD; varying float vR; varying float vV;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float s = sin(vR), c2 = cos(vR);
      uv = mat2(c2, -s, s, c2) * uv + 0.5;      // rotate so repeats never line up
      if(uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0) discard;   // no bleed across tiles
      vec2 off = vec2(mod(vV,2.0), floor(vV/2.0)) * 0.5;
      vec4 c = texture2D(uTex, uv*0.5 + off);
      if(c.a < 0.006) discard;                  // early out: this is the fill cost
      gl_FragColor = vec4(c.rgb * vD, c.a * vA);
    }`
});
const dust=new THREE.Points(dGeo,dMat); dust.frustumCulled=false; scene.add(dust);

// dust is pure fill cost: every screen pixel gets blended through many layers.
// rendering it at half resolution quarters that, and a soft low-frequency
// cloud loses nothing to the downsample. this is the actual fix, not particle
// count. DUST_LAYER keeps it out of the main pass.
const DUST_LAYER=1;
dust.layers.set(DUST_LAYER);
const rtScale=0.5;
const rt=new THREE.WebGLRenderTarget(
  Math.max(2,Math.floor(innerWidth*rtScale)), Math.max(2,Math.floor(innerHeight*rtScale)),
  {minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,depthBuffer:false});
const compCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const compScene=new THREE.Scene();
compScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),
  new THREE.MeshBasicMaterial({map:rt.texture,transparent:true,depthTest:false,
    depthWrite:false})));
function sizeRT(){
  rt.setSize(Math.max(2,Math.floor(innerWidth*rtScale)),
             Math.max(2,Math.floor(innerHeight*rtScale)));
  dMat.uniforms.uPix.value=rt.height;   // point size is in render-target pixels
}
sizeRT();

const T_EASE=0.34, T_FALL=0.46, T_IMPACT=T_EASE+T_FALL, DUR=6.2;
const DROP=0.72;                    // she falls this far. the camera never moves.
const easeOut=x=>1-Math.pow(1-x,3), easeIn=x=>x*x;

let intact=null, shards=null, mixer=null, simDur=1, baseY=0;
let state='IDLE', t=0, dragAmt=0, spin=0;

const draco=new DRACOLoader(); draco.setDecoderPath('../vendor/draco/');
const L=new GLTFLoader(); L.setDRACOLoader(draco);
const hud=document.getElementById('hud');

L.load('../sim/sim.glb',(s)=>{
  shards=s.scene; shards.visible=false; scene.add(shards);
  let n=0; shards.traverse(o=>{ if(o.isMesh){ o.material=marble; n++; } });
  const sb=new THREE.Box3().setFromObject(shards), c=new THREE.Vector3(); sb.getCenter(c);
  baseY=sb.min.y; cam.lookAt(0,c.y+0.30,0); dust.position.y=baseY;
  mixer=new THREE.AnimationMixer(shards); simDur=0;
  for(const cl of s.animations){ const a=mixer.clipAction(cl);
    a.loop=THREE.LoopOnce; a.clampWhenFinished=true; a.play(); simDur=Math.max(simDur,cl.duration); }

  L.load('../marie.glb',(g)=>{
    const b=new THREE.Box3().setFromObject(g.scene), ic=new THREE.Vector3(); b.getCenter(ic);
    g.scene.position.sub(ic);
    intact=new THREE.Group(); intact.add(g.scene);
    intact.scale.setScalar((sb.max.y-sb.min.y)/(b.max.y-b.min.y));
    g.scene.position.y+=(ic.y-b.min.y);
    intact.traverse(o=>{ if(o.isMesh) o.material=marble; });
    scene.add(intact);
    hud.innerHTML='<b>shards</b> '+n+'<br><b>dust</b> '+DUST+'<br><b>drop</b> '+
      T_IMPACT.toFixed(2)+'s<br><b>fps</b> <span id="fps">--</span>';
    document.getElementById('hint').classList.add('in');
    sync();
  });
},undefined,(e)=>{hud.textContent='FAILED '+e;});

function sync(){
  const impacted = state!=='IDLE' && t>=T_IMPACT;
  const ta = Math.max(0,t-T_IMPACT);

  let lift=DROP, rot=spin;
  if(state==='IDLE') lift=DROP;
  else if(!impacted){
    if(t<T_EASE){ const k=easeOut(t/T_EASE); lift=DROP+k*0.10; rot=spin+k*0.04; }
    else { const k=easeIn((t-T_EASE)/T_FALL); lift=(DROP+0.10)*(1-k); rot=spin+0.04+k*0.10; }
  } else lift=0;

  if(intact){ intact.position.y=baseY+lift; intact.rotation.y=rot; intact.visible=!impacted; }
  if(shards){ shards.visible=impacted; shards.rotation.y=rot; }

  // the bake plays straight, exactly as it does in the sim viewer
  if(mixer && impacted) mixer.setTime(Math.min(ta,simDur));

  if(impacted){
    const arr=dGeo.attributes.position.array;
    for(let i=0;i<DUST;i++){
      const age=ta-aBirth[i];
      if(age<0){ arr[i*3]=0; arr[i*3+1]=-999; arr[i*3+2]=0; continue; }
      const drag=1-Math.exp(-age*0.85);          // billows, then stalls and hangs
      const sw=Math.sin(dSeed[i]+age*1.15), sw2=Math.cos(dSeed[i]*1.7+age*0.85);
      arr[i*3]  =dPos[i*3]  +dVel[i*3]  *drag*1.25+sw*0.16*age;
      arr[i*3+1]=Math.max(0.004,dPos[i*3+1]+dVel[i*3+1]*drag*0.95
                 -0.05*age*age+sw2*0.13*age);
      arr[i*3+2]=dPos[i*3+2]+dVel[i*3+2]*drag*1.25+sw2*0.14*age;
    }
    dGeo.attributes.position.needsUpdate=true;
    dMat.uniforms.uTime.value=ta;
  } else dMat.uniforms.uTime.value=-1;

  const rv=document.getElementById('reveal');
  if(rv) rv.style.opacity = impacted ? Math.max(0,Math.min(1,(ta-3.15)/1.1)).toFixed(3) : '0';

  document.getElementById('tn').textContent=t.toFixed(2)+'s';
  document.getElementById('sc').value=Math.round(t/DUR*500);
}

let dragging=false,lx=0,tDown=0;
addEventListener('pointerdown',e=>{ if(e.target.closest('#tl')) return;
  dragging=true; lx=e.clientX; dragAmt=0; tDown=performance.now();
  try{R.domElement.setPointerCapture(e.pointerId);}catch(_){} });
addEventListener('pointermove',e=>{ if(!dragging) return;
  const dx=e.clientX-lx; lx=e.clientX; dragAmt+=Math.abs(dx);
  if(state==='IDLE') spin+=dx*0.006; });
addEventListener('pointerup',e=>{ if(!dragging) return; dragging=false;
  if(e.target.closest('#tl')) return;
  const quick=performance.now()-tDown<400;
  if((dragAmt<14||quick) && state==='IDLE' && shards){ state='RUN'; t=0;
    document.body.classList.add('tapped');
    document.getElementById('hint').classList.remove('in'); } });
document.getElementById('pp').addEventListener('click',()=>{ if(shards){state='RUN'; t=0;} });
document.getElementById('sc').addEventListener('input',e=>{ if(!shards) return;
  state='SCRUB'; t=+e.target.value/500*DUR;
  document.getElementById('hint').classList.remove('in'); sync(); });
document.getElementById('hd').addEventListener('click',()=>{
  document.getElementById('tl').classList.toggle('hide'); });
const qt=new URLSearchParams(location.search).get('t');
if(qt!==null){ state='SCRUB'; t=Math.max(0,Math.min(DUR,+qt)); }

let f=0,last=performance.now(); const clock=new THREE.Clock();
(function tick(){ requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05);
  if(state==='RUN'){ t+=dt; if(t>=DUR){ t=DUR; state='DONE'; } sync(); }
  if(state==='IDLE'){ if(!dragging) spin+=dt*0.12; sync(); }
  // pass 1: dust alone, half res, transparent clear
  cam.layers.disableAll(); cam.layers.enable(DUST_LAYER);
  R.setRenderTarget(rt); R.setClearColor(0x000000,0); R.clear(true,false,false);
  R.render(scene,cam);
  // pass 2: everything else at full res
  cam.layers.disableAll(); cam.layers.enable(0);
  R.setRenderTarget(null); R.setClearColor(0x000000,1); R.clear();
  R.render(scene,cam);
  // pass 3: composite the upscaled dust over it
  R.autoClear=false; R.render(compScene,compCam); R.autoClear=true;
  f++; const p=performance.now();
  if(p-last>1000){
    const fps=Math.round(f*1000/(p-last));
    const el=document.getElementById('fps'); if(el) el.textContent=fps;
    // a retina buffer is 4x the pixels; drop it before dropping the look
    if(fps<34 && DPR>1){ DPR=Math.max(1,DPR-0.5); R.setPixelRatio(DPR); sizeRT(); }
    else if(fps>56 && DPR<Math.min(devicePixelRatio,2)){
      DPR=Math.min(Math.min(devicePixelRatio,2),DPR+0.5); R.setPixelRatio(DPR); sizeRT(); }
    f=0; last=p; } })();
addEventListener('resize',()=>{ sizeRT();
  cam.aspect=innerWidth/innerHeight;
  cam.updateProjectionMatrix(); R.setSize(innerWidth,innerHeight); });
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Marie &mdash; intro</title>
<style>
 *{box-sizing:border-box} html,body{margin:0;height:100%;background:#000;overflow:hidden}
 body{font-family:"Iowan Old Style",Palatino,Georgia,serif;touch-action:none;cursor:grab}
 body.run{cursor:default}
 canvas{display:block;position:fixed;inset:0;z-index:1}
 #dustvid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:3;
   opacity:0;pointer-events:none}
 #reveal{position:fixed;inset:0;z-index:2;opacity:0;pointer-events:none;
   display:flex;flex-direction:column;align-items:center;justify-content:center;
   background:radial-gradient(ellipse 72% 62% at 50% 56%,#3d2c18 0%,#1e1409 46%,#080503 79%,#000 100%)}
 #rtitle{font-size:clamp(30px,6.2vw,72px);color:#f2e4c6;letter-spacing:.015em;opacity:0;
   text-shadow:0 0 46px rgba(201,162,78,.42)}
 #rsub{margin-top:.75em;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;opacity:0;
   letter-spacing:.3em;color:#9d8657;text-transform:uppercase}
 #hint{position:fixed;left:0;right:0;bottom:12vh;text-align:center;z-index:4;color:#9a9188;
   font-size:clamp(12px,1.6vw,17px);letter-spacing:.2em;opacity:0;transition:opacity 1s ease;
   pointer-events:none;text-transform:uppercase}
 #hint.in{opacity:.8}
 .hud{position:fixed;left:14px;top:12px;z-index:5;color:#544d42;font-size:11px;line-height:1.75;
   font-family:ui-monospace,Menlo,monospace} .hud b{color:#8d7f5c;font-weight:400}
 #tl{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:9;display:flex;gap:9px;
   align-items:center;background:rgba(9,8,5,.9);border:1px solid #2b2419;border-radius:9px;
   padding:9px 13px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#c9a24e}
 #tl button{font:inherit;background:#171208;color:#c9a24e;border:1px solid #3d3524;border-radius:5px;
   padding:6px 10px;cursor:pointer;min-height:32px} #tl button:hover{border-color:#c9a24e}
 #tl input{width:min(300px,40vw);accent-color:#c9a24e} #tn{min-width:76px}
 #tl.hide{display:none}
 @media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style></head><body>
<div class="hud" id="hud">loading&hellip;</div>
<video id="dustvid" playsinline muted preload="auto" disablepictureinpicture></video>
<div id="reveal"><div id="rtitle">Abby&rsquo;s Museum</div>
<div id="rsub">est. 2026 &middot; Chicago</div></div>
<div id="hint">drag to look &middot; tap to shatter</div>
<div id="tl"><button id="pp">replay</button><span id="tn">0.00s</span>
<input type="range" id="sc" min="0" max="500" step="1" value="0" aria-label="Scrub the intro">
<button id="hd">hide</button></div>
<script type="importmap">
{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../vendor/loaders/GLTFLoader.js';
import { DRACOLoader } from '../vendor/loaders/DRACOLoader.js';

/* ── the shot ──────────────────────────────────────────────────────────────
   A  0.00-tap   stable, fully framed bust. drag orbits the camera; she never moves.
   B  0.00-0.34  anticipation: she settles back before letting go
   C  0.34-0.92  the fall, accelerating under gravity
   D  0.92       impact
   E-G 0.92+     the Blender bake breaks; the Mantaflow dust plays over it
   H  swap behind the dust, then the title through the clearing haze

   Every number below is derived from measured geometry or stated once here.
   Nothing is a magic pixel value.                                          */
const FOV       = 40;
const FILL      = 0.46;   // she is the whole subject here, not one work on a wall
const HEADROOM  = 0.17;   // above her crown at rest; the rest is room to fall into
const T_EASE    = 0.34;
const T_FALL    = 0.58;
const T_IMPACT  = T_EASE + T_FALL;
const DROP      = 1.25;   // multiples of bust height
const SWAP_AT   = 1.25;   // seconds after impact: peak obscuration
const TITLE_AT  = 1.62;
const DUR       = 5.4;

const R = new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2)); R.setSize(innerWidth,innerHeight);
R.setClearColor(0x000000,1); R.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(R.domElement);

const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(FOV,innerWidth/innerHeight,0.02,120);
scene.add(new THREE.AmbientLight(0x33343a,0.75));
const key=new THREE.DirectionalLight(0xfff8ef,2.4); key.position.set(-1.4,1.2,1.6); scene.add(key);
const fill=new THREE.DirectionalLight(0xd8e4ff,0.5); fill.position.set(1.6,0.2,1.0); scene.add(fill);
const rim=new THREE.DirectionalLight(0xfff2dd,1.3); rim.position.set(0.8,0.9,-1.7); scene.add(rim);
const marble=new THREE.MeshStandardMaterial({color:0xdcd8d1,roughness:0.47,vertexColors:true});

function radialTex(stops){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const g=c.getContext('2d'), rg=g.createRadialGradient(128,128,0,128,128,128);
  for(const [o,col] of stops) rg.addColorStop(o,col);
  g.fillStyle=rg; g.fillRect(0,0,256,256); return new THREE.CanvasTexture(c);
}
const floorMesh=new THREE.Mesh(new THREE.PlaneGeometry(1,1),
  new THREE.MeshBasicMaterial({map:radialTex([[0,'rgba(150,140,125,.80)'],
    [0.42,'rgba(66,60,52,.30)'],[1,'rgba(0,0,0,0)']]),transparent:true,depthWrite:false,opacity:0}));
floorMesh.rotation.x=-Math.PI/2; scene.add(floorMesh);
const contact=new THREE.Mesh(new THREE.PlaneGeometry(1,1),
  new THREE.MeshBasicMaterial({map:radialTex([[0,'rgba(0,0,0,.85)'],
    [0.55,'rgba(0,0,0,.32)'],[1,'rgba(0,0,0,0)']]),transparent:true,depthWrite:false,opacity:0}));
contact.rotation.x=-Math.PI/2; scene.add(contact);

// two encodes because only Safari does HEVC alpha and only Chrome/Firefox VP9 alpha
const dv=document.getElementById('dustvid');
let vidReady=false, vidDur=1.83;
dv.src = dv.canPlayType('video/mp4; codecs="hvc1"')!=='' ? './dust_hevc.mp4' : './dust_vp9.webm';
dv.addEventListener('loadedmetadata',()=>{ if(dv.duration) vidDur=dv.duration; });
dv.addEventListener('canplaythrough',()=>{ vidReady=true; },{once:true});
dv.addEventListener('error',()=>{ vidReady=false; });

let intact=null, shards=null, mixer=null, simDur=1;
let bustH=1, bustMinY=0, bustMidY=0, ORB=5;
let state='IDLE', t=0, az=0, el=0.05, dragAmt=0, swapped=false;
const EL_MIN=-1.1, EL_MAX=1.25;

const draco=new DRACOLoader(); draco.setDecoderPath('../vendor/draco/');
const L=new GLTFLoader(); L.setDRACOLoader(draco);
const hud=document.getElementById('hud');
const ease=(x)=>1-Math.pow(1-x,3), accel=(x)=>x*x;

L.load('../sim/sim.glb',(g)=>{
  shards=g.scene; shards.visible=false; scene.add(shards);
  let n=0; shards.traverse(o=>{ if(o.isMesh){ o.material=marble; n++; } });
  mixer=new THREE.AnimationMixer(shards); simDur=0;
  for(const cl of g.animations){ const a=mixer.clipAction(cl);
    a.loop=THREE.LoopOnce; a.clampWhenFinished=true; a.play();
    simDur=Math.max(simDur,cl.duration); }
  // measure at frame 0, when the pieces are assembled, not at the load pose
  mixer.setTime(0); shards.updateMatrixWorld(true);
  const b=new THREE.Box3().setFromObject(shards);
  bustH=b.max.y-b.min.y; bustMinY=b.min.y; bustMidY=(b.max.y+b.min.y)/2;
  // frame height at distance R is 2*R*tan(fov/2); solve for the share we want
  ORB = bustH/(2*FILL*Math.tan(THREE.MathUtils.degToRad(FOV/2)));

  L.load('../marie.glb',(gi)=>{
    const ib=new THREE.Box3().setFromObject(gi.scene), ic=new THREE.Vector3(); ib.getCenter(ic);
    gi.scene.position.sub(ic);
    intact=new THREE.Group(); intact.add(gi.scene);
    intact.scale.setScalar(bustH/(ib.max.y-ib.min.y));
    gi.scene.position.y += (ic.y-ib.min.y);        // feet at the group origin
    intact.traverse(o=>{ if(o.isMesh) o.material=marble; });
    scene.add(intact);
    hud.innerHTML='<b>shards</b> '+n+'<br><b>bust</b> '+bustH.toFixed(2)+'u<br><b>orbit</b> '+
      ORB.toFixed(2)+'u<br><b>drop</b> '+T_IMPACT.toFixed(2)+'s<br><b>fps</b> <span id="fps">--</span>';
    document.getElementById('hint').classList.add('in');
    sync();
  });
},undefined,(e)=>{hud.textContent='FAILED '+e;});

function sync(){
  const running = state!=='IDLE';
  const hit = running && t>=T_IMPACT;
  const ta = Math.max(0, t-T_IMPACT);

  // ── where she is ───────────────────────────────────────────────────────
  let lift = DROP*bustH;
  if(running && !hit){
    if(t<T_EASE) lift = DROP*bustH + ease(t/T_EASE)*0.06*bustH;   // settles back
    else lift = (DROP*bustH+0.06*bustH) * (1-accel((t-T_EASE)/T_FALL));
  } else if(hit) lift = 0;

  if(intact){ intact.position.y = bustMinY + lift; intact.visible = !hit; }
  if(shards){ shards.visible = hit; }

  // the ground resolves as she nears it, so the drop has a destination
  const near = 1 - Math.min(1, lift/(DROP*bustH||1));
  const fs = bustH*7;
  floorMesh.scale.set(fs,fs,fs); floorMesh.position.set(0,bustMinY-0.002,0);
  floorMesh.material.opacity = running ? Math.min(0.5, near*near*0.6) + (hit?0.14:0) : 0;
  const cs = bustH*(2.1-near*1.05);
  contact.scale.set(cs,cs,cs); contact.position.set(0,bustMinY+0.004,0);
  contact.material.opacity = running
    ? Math.min(0.72, near*near*0.85) * (hit ? Math.max(0,1-ta*0.8) : 1) : 0;

  // ── the camera frames her, wherever she is ─────────────────────────────
  // solve the aim so her crown sits HEADROOM below the top edge
  const frameH = 2*ORB*Math.tan(THREE.MathUtils.degToRad(FOV/2));
  // The camera is LOCKED OFF for the fall. Tracking her cancelled the very
  // motion the shot exists to show: she dropped 2.5 units and the frame moved
  // with her, so she appeared to hang still and then simply break. It holds the
  // idle composition while she falls through it, then settles to the wreck.
  const restCrown = bustMinY + DROP*bustH + 0.06*bustH + bustH;
  const aimHigh   = restCrown - frameH*(0.5-HEADROOM);
  const aimGround = bustMinY + bustH*0.62;
  const settle    = hit ? Math.min(1, ta/0.45) : 0;
  const aimY      = aimHigh + (aimGround-aimHigh)*(settle*settle*(3-2*settle));
  cam.position.set(
    ORB*Math.cos(el)*Math.sin(az),
    aimY + ORB*Math.sin(el),
    ORB*Math.cos(el)*Math.cos(az));
  let shake=0;
  if(hit && ta<0.18){ const k=1-ta/0.18; shake=k*k*0.03*bustH; }   // felt, not seen
  cam.position.x += Math.sin(ta*127)*shake;
  cam.position.y += Math.cos(ta*151)*shake;
  cam.lookAt(0,aimY,0);

  // ── the break ──────────────────────────────────────────────────────────
  if(mixer && hit) mixer.setTime(Math.min(ta,simDur));

  // ── the dust ───────────────────────────────────────────────────────────
  // the clip is shorter than the shot, so it must fade out rather than hold
  // its final fully-covered frame on screen for the rest of the sequence
  if(vidReady){
    if(hit){
      const want=Math.min(ta, vidDur-0.01);
      if(state==='SCRUB'){ if(Math.abs(dv.currentTime-want)>0.05) dv.currentTime=want; }
      else if(dv.paused && ta<0.06){ dv.currentTime=0; dv.play().catch(()=>{}); }
      const tail=Math.max(0,(ta-(vidDur-0.35))/1.5);
      dv.style.opacity=Math.max(0,1-tail).toFixed(3);
    } else { dv.style.opacity='0'; if(!dv.paused) dv.pause(); }
  }

  // ── the swap, hidden inside the cloud, then the title through the haze ─
  const rv=document.getElementById('reveal');
  const ti=document.getElementById('rtitle'), sb=document.getElementById('rsub');
  const showing = hit && ta>=SWAP_AT;
  rv.style.opacity = showing ? '1' : '0';
  const k=Math.max(0,Math.min(1,(ta-TITLE_AT)/0.8));
  const e=k<0.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
  ti.style.opacity=e.toFixed(3); sb.style.opacity=e.toFixed(3);

  document.getElementById('tn').textContent=t.toFixed(2)+'s';
  document.getElementById('sc').value=Math.round(t/DUR*500);
  R.render(scene,cam);
}

// ── input: she is fixed, the camera orbits, and only on a real tap ────────
let dragging=false,lx=0,ly=0,tDown=0;
addEventListener('pointerdown',e=>{ if(e.target.closest('#tl')) return;
  dragging=true; lx=e.clientX; ly=e.clientY; dragAmt=0; tDown=performance.now();
  try{R.domElement.setPointerCapture(e.pointerId);}catch(_){} });
addEventListener('pointermove',e=>{ if(!dragging) return;
  const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
  dragAmt+=Math.abs(dx)+Math.abs(dy);
  if(state==='IDLE'){ az-=dx*0.0062; el=Math.max(EL_MIN,Math.min(EL_MAX,el+dy*0.005)); sync(); } });
addEventListener('pointerup',e=>{ if(!dragging) return; dragging=false;
  if(e.target.closest('#tl')) return;
  const quick=performance.now()-tDown<400;
  if((dragAmt<14||quick) && state==='IDLE' && shards){ start(); } });
function start(){ state='RUN'; t=0; swapped=false; az=0; el=0.05;
  document.body.classList.add('run');
  document.getElementById('hint').classList.remove('in'); }
document.getElementById('pp').addEventListener('click',()=>{ if(shards) start(); });
document.getElementById('sc').addEventListener('input',e=>{ if(!shards) return;
  state='SCRUB'; t=+e.target.value/500*DUR;
  document.getElementById('hint').classList.remove('in'); sync(); });
document.getElementById('hd').addEventListener('click',()=>{
  document.getElementById('tl').classList.toggle('hide'); });
const qt=new URLSearchParams(location.search).get('t');
if(qt!==null){ state='SCRUB'; t=Math.max(0,Math.min(DUR,+qt)); }

let f=0,last=performance.now(); const clock=new THREE.Clock();
(function tick(){ requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05);
  if(state==='RUN'){ t+=dt; if(t>=DUR){ t=DUR; state='DONE'; } }
  sync();
  f++; const p=performance.now();
  if(p-last>1000){ const el2=document.getElementById('fps');
    if(el2) el2.textContent=Math.round(f*1000/(p-last)); f=0; last=p; } })();
addEventListener('resize',()=>{ cam.aspect=innerWidth/innerHeight;
  cam.updateProjectionMatrix(); R.setSize(innerWidth,innerHeight); });
</script></body></html>

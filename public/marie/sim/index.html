<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<meta name="robots" content="noindex,nofollow">
<title>Marie &mdash; Blender sim</title>
<style>
 *{box-sizing:border-box} html,body{margin:0;height:100%;background:#000;overflow:hidden}
 body{font-family:"Iowan Old Style",Palatino,Georgia,serif;touch-action:none}
 canvas{display:block;position:fixed;inset:0}
 .hud{position:fixed;left:14px;top:12px;z-index:3;color:#544d42;font-size:11px;line-height:1.75;
   font-family:ui-monospace,Menlo,monospace} .hud b{color:#8d7f5c;font-weight:400}
 #tl{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:9;display:flex;gap:9px;
   align-items:center;background:rgba(9,8,5,.9);border:1px solid #2b2419;border-radius:9px;padding:9px 13px;
   font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#c9a24e}
 #tl button{font:inherit;background:#171208;color:#c9a24e;border:1px solid #3d3524;border-radius:5px;
   padding:5px 9px;cursor:pointer} #tl button:hover{border-color:#c9a24e}
 #tl input{width:min(340px,44vw);accent-color:#c9a24e} #fn{min-width:92px}
</style></head><body>
<div class="hud" id="hud">loading&hellip;</div>
<div id="tl"><button id="pp">play</button><button id="pv">&#9664;</button><button id="nx">&#9654;</button>
<span id="fn">FRAME 0 / 95</span><input type="range" id="sc" min="0" max="95" step="1" value="0">
<button id="rs">reset</button></div>
<script type="importmap">
{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../vendor/loaders/GLTFLoader.js';
import { DRACOLoader } from '../vendor/loaders/DRACOLoader.js';
import { OrbitControls } from '../vendor/controls/OrbitControls.js';
const R=new THREE.WebGLRenderer({antialias:true}); R.setPixelRatio(Math.min(devicePixelRatio,2));
R.setSize(innerWidth,innerHeight); R.setClearColor(0x000000,1);
R.toneMapping=THREE.ACESFilmicToneMapping; document.body.appendChild(R.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.02,80); cam.position.set(0,0.35,3.1);
scene.add(new THREE.AmbientLight(0x33343a,0.75));
const key=new THREE.DirectionalLight(0xfff8ef,2.4); key.position.set(-1.4,1.2,1.6); scene.add(key);
const fill=new THREE.DirectionalLight(0xd8e4ff,0.5); fill.position.set(1.6,0.2,1.0); scene.add(fill);
const rim=new THREE.DirectionalLight(0xfff2dd,1.3); rim.position.set(0.8,0.9,-1.7); scene.add(rim);
const controls=new OrbitControls(cam,R.domElement); controls.enableDamping=true; controls.enablePan=false;
controls.target.set(0,0.25,0);
const marble=new THREE.MeshStandardMaterial({color:0xdcd8d1,roughness:0.47,
  vertexColors:true});   // baked AO + dust buildup ride in the mesh
const FPS=24; let mixer=null, playing=false, T=0, DUR=1;
let shards=null, intact=null; const actions=[];
const draco=new DRACOLoader(); draco.setDecoderPath('../vendor/draco/');
const L=new GLTFLoader(); L.setDRACOLoader(draco);
L.load('./sim.glb',(g)=>{
  let n=0,tris=0;
  g.scene.traverse(o=>{ if(o.isMesh){ o.material=marble; n++;
    tris+=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3; }});
  shards=g.scene; scene.add(shards);
  const b=new THREE.Box3().setFromObject(shards), c=new THREE.Vector3(); b.getCenter(c);
  controls.target.set(0,c.y,0); cam.lookAt(0,c.y,0);
  // Blender writes one animation per piece, so playing animations[0] alone
  // froze the other 120 and read as a static crazed bust
  if(g.animations.length){ mixer=new THREE.AnimationMixer(shards); DUR=0;
    for(const cl of g.animations){ const a=mixer.clipAction(cl);
      a.loop=THREE.LoopOnce; a.clampWhenFinished=true; a.play();
      actions.push(a); DUR=Math.max(DUR,cl.duration); } }
  const qf=new URLSearchParams(location.search).get('f');
  if(qf!==null) T=Math.max(0,Math.min(95,+qf))/FPS;

  // she has to look normal until it breaks: adjacent shards always show their
  // cut faces, so the whole bust covers them until the first frame of motion
  L.load('../marie.glb',(gi)=>{
    gi.scene.traverse(o=>{ if(o.isMesh) o.material=marble; });
    const ib=new THREE.Box3().setFromObject(gi.scene), ic=new THREE.Vector3(); ib.getCenter(ic);
    gi.scene.position.sub(ic); gi.scene.position.y+=c.y;
    const is=(b.max.y-b.min.y)/(ib.max.y-ib.min.y);
    gi.scene.scale.setScalar(is);
    intact=gi.scene; scene.add(intact); sync();
  });

  document.getElementById('hud').innerHTML='<b>pieces</b> '+n+'<br><b>triangles</b> '+
    Math.round(tris).toLocaleString()+'<br><b>glb</b> 1.06 MB draco + baked sim'+
    '<br><b>clip</b> '+DUR.toFixed(2)+'s<br><b>fps</b> <span id="fps">--</span>';
  sync();
},undefined,(e)=>{document.getElementById('hud').textContent='FAILED '+e;});
const ui={fn:document.getElementById('fn'),sc:document.getElementById('sc'),pp:document.getElementById('pp')};
function sync(){ const n=Math.round(T*FPS); ui.fn.textContent='FRAME '+n+' / 95'; ui.sc.value=n;
  // a paused action has an effective timeScale of 0, so setTime cannot move it
  // and the whole scrubber was a no-op. clear it every time before seeking.
  if(mixer){ for(const a of actions){ a.paused=false; a.enabled=true; }
    mixer.setTime(Math.min(T,DUR)); }
  // hard switch, never both: overlapping them shows cut faces across her surface
  if(intact){ intact.visible = n<1; if(shards) shards.visible = !intact.visible; } }
ui.sc.addEventListener('input',()=>{playing=false;ui.pp.textContent='play';T=+ui.sc.value/FPS;sync();});
ui.pp.addEventListener('click',()=>{playing=!playing;ui.pp.textContent=playing?'pause':'play';if(T>=DUR)T=0;});
document.getElementById('pv').addEventListener('click',()=>{playing=false;ui.pp.textContent='play';T=Math.max(0,T-1/FPS);sync();});
document.getElementById('nx').addEventListener('click',()=>{playing=false;ui.pp.textContent='play';T=Math.min(DUR,T+1/FPS);sync();});
document.getElementById('rs').addEventListener('click',()=>{playing=false;ui.pp.textContent='play';T=0;sync();});
let f=0,last=performance.now(); const clock=new THREE.Clock();
(function tick(){requestAnimationFrame(tick); const dt=Math.min(clock.getDelta(),0.05);
 if(playing){ T+=dt; if(T>=DUR){T=DUR;playing=false;ui.pp.textContent='play';} sync(); }
 controls.update(); R.render(scene,cam);
 f++; const p=performance.now();
 if(p-last>1000){const e=document.getElementById('fps'); if(e)e.textContent=Math.round(f*1000/(p-last)); f=0; last=p;}
})();
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>

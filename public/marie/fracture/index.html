<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Marie &mdash; fracture, interactive</title>
<style>
 *{box-sizing:border-box} html,body{margin:0;height:100%;background:#000;overflow:hidden}
 body{font-family:"Iowan Old Style",Palatino,Georgia,serif;color:#cfc6b4;touch-action:none}
 canvas{display:block;position:fixed;inset:0}
 .hud{position:fixed;left:14px;top:12px;z-index:3;color:#5a5348;font-size:11px;line-height:1.75;
   font-family:ui-monospace,Menlo,monospace}
 .hud b{color:#9a8b63;font-weight:400}
 .panel{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:4;
   display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;
   background:rgba(10,9,6,.82);border:1px solid #2b2419;border-radius:11px;padding:12px 18px;
   backdrop-filter:blur(6px);max-width:94vw}
 .panel label{font-size:12px;letter-spacing:.12em;color:#8d846f;text-transform:uppercase}
 input[type=range]{width:clamp(120px,22vw,220px);accent-color:#c9a24e}
 button{font-family:inherit;font-size:12.5px;letter-spacing:.1em;cursor:pointer;
   background:#171208;color:#c9a24e;border:1px solid #3d3524;border-radius:6px;padding:7px 13px}
 button:hover{border-color:#c9a24e;color:#e8ce93}
 button.on{background:#2a1f0c;color:#e8ce93;border-color:#c9a24e}
 .tip{position:fixed;left:0;right:0;bottom:96px;text-align:center;z-index:3;
   font-size:13px;color:#6d6555;letter-spacing:.08em}
 a{color:#8d7a4a;font-size:12px}
</style></head><body>
<div class="hud" id="hud">loading&hellip;</div>
<div class="tip">drag to orbit &middot; scroll to zoom</div>
<div class="panel">
  <label>explode</label><input type="range" id="ex" min="0" max="100" value="55">
  <button id="spin" class="on">spin</button>
  <button id="iso">front view</button>
  <button id="hero">show heroes</button>
  <a href="../">&larr; statue</a>
</div>
<script type="importmap">
{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../vendor/loaders/GLTFLoader.js';
import { DRACOLoader } from '../vendor/loaders/DRACOLoader.js';
import { OrbitControls } from '../vendor/controls/OrbitControls.js';

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight); renderer.setClearColor(0x000000,1);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.05,80);
camera.position.set(0,0.1,3.0);
const key=new THREE.DirectionalLight(0xfff8ef,2.4); key.position.set(-1.4,1.2,1.6); scene.add(key);
const fill=new THREE.DirectionalLight(0xd8e4ff,0.5); fill.position.set(1.6,0.2,1.0); scene.add(fill);
const rim=new THREE.DirectionalLight(0xfff2dd,1.3); rim.position.set(0.8,0.9,-1.7); scene.add(rim);
scene.add(new THREE.AmbientLight(0x35363c,0.8));
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.enablePan=false;
controls.target.set(0,0,0);

const group=new THREE.Group(); scene.add(group);
const shards=[]; let spinning=true, coloured=false; const GLBMB='1.17';
const plain=new THREE.MeshStandardMaterial({color:0xdcd8d1,roughness:0.46,metalness:0});

const draco=new DRACOLoader(); draco.setDecoderPath('../vendor/draco/');
const loader=new GLTFLoader(); loader.setDRACOLoader(draco);
loader.load('./shards.glb',(g)=>{
  const box=new THREE.Box3().setFromObject(g.scene), c=new THREE.Vector3(); box.getCenter(c);
  let tris=0;
  g.scene.traverse(o=>{
    if(!o.isMesh) return;
    const geo=o.geometry; geo.computeBoundingSphere();
    const n=(geo.index?geo.index.count:geo.attributes.position.count)/3; tris+=n;
    o.material=plain;
    const isHero=/^hero/i.test(o.name);
    const wp=new THREE.Vector3(); o.getWorldPosition(wp); wp.sub(c);
    const dir=wp.clone(); if(dir.length()<1e-5) dir.set(Math.random()-.5,Math.random()-.5,Math.random()-.5);
    shards.push({mesh:o, hero:isHero, home:o.position.clone(), dir:dir.normalize(), tris:n,
      r:geo.boundingSphere.radius, spin:new THREE.Vector3((Math.random()-.5)*.5,(Math.random()-.5)*.5,(Math.random()-.5)*.5)});
  });
  g.scene.position.sub(c); group.add(g.scene);
  const rr=shards.map(s=>s.r).sort((a,b)=>b-a);
  document.getElementById('hud').innerHTML=
    '<b>fragments</b> '+shards.length+
    '<br><b>triangles</b> '+Math.round(tris).toLocaleString()+
    '<br><b>heroes</b> '+shards.filter(x=>x.hero).length+' kept whole'+'<br><b>glb</b> '+GLBMB+' MB draco'+
    '<br><b>largest</b> '+rr[0].toFixed(3)+'u  <b>smallest</b> '+rr[rr.length-1].toFixed(4)+'u'+
    '<br><b>fps</b> <span id="fps">--</span>';
  apply();
});

function apply(){
  const k=+document.getElementById('ex').value/100;
  for(const s of shards){
    s.mesh.position.copy(s.home).addScaledVector(s.dir, k*(s.hero?0.55:1.15));
    if(coloured){
      s.mesh.material=new THREE.MeshStandardMaterial({
        color: s.hero ? new THREE.Color(0xc9a24e) : new THREE.Color(0x5d6b7a), roughness:.5});
    } else s.mesh.material=plain;
  }
}
document.getElementById('ex').addEventListener('input',apply);
document.getElementById('spin').addEventListener('click',e=>{spinning=!spinning;e.target.classList.toggle('on',spinning);});
document.getElementById('iso').addEventListener('click',()=>{
  camera.position.set(0,0.1,3.0); controls.target.set(0,0,0); group.rotation.y=0;});
document.getElementById('hero').addEventListener('click',e=>{coloured=!coloured;e.target.classList.toggle('on',coloured);apply();});

let f=0,last=performance.now();
(function tick(){requestAnimationFrame(tick);
 if(spinning) group.rotation.y+=0.0035;
 controls.update(); renderer.render(scene,camera);
 f++; const now=performance.now();
 if(now-last>1000){const el=document.getElementById('fps'); if(el)el.textContent=Math.round(f*1000/(now-last)); f=0; last=now;}
})();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>

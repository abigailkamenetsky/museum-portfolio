<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><link rel="icon" href="data:,">
<title>iframe test</title>
<style>
 html,body{margin:0;height:100%;background:#123}
 #f{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2;background:#204}
 #o{position:fixed;left:0;right:0;bottom:0;z-index:9;background:rgba(0,0,0,.85);color:#0f0;
    font:11px ui-monospace,Menlo,monospace;padding:8px;white-space:pre-wrap}
</style></head><body>
<iframe id="f" src="../../preview/"></iframe>
<div id="o">loading…</div>
<script>
var f=document.getElementById('f'), o=document.getElementById('o'), lines=[];
function log(s){ lines.push(s); o.textContent=lines.join('\n'); }
log('ua: '+navigator.userAgent.slice(0,60));
f.addEventListener('load',function(){
  log('iframe load fired');
  try{
    var d=f.contentDocument;
    log('contentDocument: '+(d?'yes':'NULL'));
    if(d){
      log('readyState: '+d.readyState);
      log('has h1: '+!!d.querySelector('.entrance h1'));
      log('body height: '+(d.body?d.body.scrollHeight:'-'));
      log('rooms: '+d.querySelectorAll('.room').length);
    }
  }catch(e){ log('ERROR reading iframe: '+e.name+' '+e.message.slice(0,50)); }
  var r=f.getBoundingClientRect();
  log('iframe box: '+Math.round(r.width)+'x'+Math.round(r.height));
});
f.addEventListener('error',function(){ log('iframe ERROR event'); });
setTimeout(function(){ if(lines.length<3) log('no load event after 12s'); },12000);
</script></body></html>

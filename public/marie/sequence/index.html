<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Marie &mdash; the sequence</title>
<style>
 *{box-sizing:border-box} html,body{margin:0;height:100%;background:#000;overflow:hidden}
 body{font-family:"Iowan Old Style",Palatino,Georgia,serif;touch-action:none}
 canvas{display:block;position:fixed;inset:0}
 .hint{position:fixed;left:0;right:0;bottom:11vh;text-align:center;z-index:2;color:#9a9188;
   font-size:clamp(13px,1.6vw,17px);letter-spacing:.16em;opacity:0;transition:opacity .9s}
 .hint.in{opacity:.85} .hint.out{opacity:0;transition:opacity .18s}
 .hud{position:fixed;left:14px;top:12px;z-index:3;color:#544d42;font-size:11px;line-height:1.75;
   font-family:ui-monospace,Menlo,monospace}
 .hud b{color:#8d7f5c;font-weight:400}
 .again{position:fixed;right:14px;top:12px;z-index:4;font-family:inherit;font-size:12px;
   letter-spacing:.1em;background:#171208;color:#c9a24e;border:1px solid #3d3524;border-radius:6px;
   padding:7px 13px;cursor:pointer;opacity:0;transition:opacity .5s;pointer-events:none}
 .again.show{opacity:1;pointer-events:auto}
</style></head><body>
<div class="hint" id="hint">tap to shatter</div>
<div class="hud" id="hud">loading&hellip;</div>
<button class="again" id="again">replay</button>
<script type="importmap">
{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../vendor/loaders/GLTFLoader.js';
import { DRACOLoader } from '../vendor/loaders/DRACOLoader.js';
import { OrbitControls } from '../vendor/controls/OrbitControls.js';

const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2)); R.setSize(innerWidth,innerHeight);
R.setClearColor(0x000000,1); R.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(R.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.05,80);
const CAM0=new THREE.Vector3(0,0.06,1.92); cam.position.copy(CAM0);

const key=new THREE.DirectionalLight(0xfff8ef,2.3); key.position.set(-1.35,1.15,1.55); scene.add(key);
const fill=new THREE.DirectionalLight(0xd8e4ff,0.45); fill.position.set(1.55,0.18,0.95); scene.add(fill);
const rim=new THREE.DirectionalLight(0xfff2dd,1.2); rim.position.set(0.75,0.85,-1.6); scene.add(rim);
scene.add(new THREE.AmbientLight(0x33343a,0.7));
const marble=new THREE.MeshPhysicalMaterial({color:0xdcd8d1,roughness:0.46,vertexColors:true,sheen:0.24});
const marble2=new THREE.MeshStandardMaterial({color:0xdcd8d1,roughness:0.48});

const controls=new OrbitControls(cam,R.domElement);
controls.enableDamping=true; controls.dampingFactor=0.075; controls.enablePan=false;
controls.enableZoom=false; controls.rotateSpeed=0.6;
controls.minPolarAngle=Math.PI*0.30; controls.maxPolarAngle=Math.PI*0.70;

// ── dust: cheap additive sprites, thousands of them cost nothing ──────
const DUST=1400;
const dg=new THREE.BufferGeometry();
const dp=new Float32Array(DUST*3), dv=new Float32Array(DUST*3), dl=new Float32Array(DUST);
dg.setAttribute('position',new THREE.BufferAttribute(dp,3));
const dm=new THREE.PointsMaterial({color:0xe8e0cf,size:0.016,transparent:true,opacity:0,
  depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});
const dust=new THREE.Points(dg,dm); scene.add(dust);
function burst(y){
  for(let i=0;i<DUST;i++){
    const a=Math.random()*Math.PI*2, r=Math.random()**0.5*0.10;
    dp[i*3]=Math.cos(a)*r; dp[i*3+1]=y+Math.random()*0.05; dp[i*3+2]=Math.sin(a)*r;
    const s=0.45+Math.random()*1.5;
    dv[i*3]=Math.cos(a)*s*0.55; dv[i*3+1]=Math.random()*1.25+0.15; dv[i*3+2]=Math.sin(a)*s*0.55;
    dl[i]=0.6+Math.random()*0.9;
  }
  dg.attributes.position.needsUpdate=true; dm.opacity=0.9;
}

let bust=null, shards=[], group=null, state='LOADING', t0=0, fellTo=0;
const FLOOR=-0.62;
const draco=new DRACOLoader(); draco.setDecoderPath('../vendor/draco/');
const L=new GLTFLoader(); L.setDRACOLoader(draco);

L.load('./intact.glb',(g)=>{
  g.scene.traverse(o=>{ if(o.isMesh) o.material=marble; });
  const b=new THREE.Box3().setFromObject(g.scene), c=new THREE.Vector3(); b.getCenter(c);
  g.scene.position.sub(c);
  bust=new THREE.Group(); bust.add(g.scene); scene.add(bust);
  L.load('./shards.glb',(s)=>{
    const b2=new THREE.Box3().setFromObject(s.scene), c2=new THREE.Vector3(); b2.getCenter(c2);
    s.scene.position.sub(c2);
    group=new THREE.Group(); group.add(s.scene); group.visible=false; scene.add(group);
    s.scene.traverse(o=>{
      if(!o.isMesh) return; o.material=marble2;
      const wp=new THREE.Vector3(); o.getWorldPosition(wp);
      const d=wp.clone().sub(group.position); if(d.length()<1e-5) d.set(Math.random()-.5,Math.random()-.5,Math.random()-.5);
      d.normalize();
      const hero=/^hero/i.test(o.name);
      // heroes are art-directed toward the camera; the rest is constrained randomness
      const v=hero
        ? new THREE.Vector3(d.x*1.5+(Math.random()-.5)*.5, 0.9+Math.random()*0.8, 2.3+Math.random()*1.4)
        : new THREE.Vector3(d.x*(1.6+Math.random()*2.4), Math.abs(d.y)*1.4+Math.random()*2.1, d.z*(1.4+Math.random()*2.0)+Math.random()*0.9);
      shards.push({m:o, home:o.position.clone(), v, hero,
        w:new THREE.Vector3((Math.random()-.5)*9,(Math.random()-.5)*9,(Math.random()-.5)*9),
        delay: hero ? 0 : Math.random()*0.16});          // staggered, not one frame
    });
    state='IDLE'; document.getElementById('hint').classList.add('in');
    hud();
  });
});
function hud(){ document.getElementById('hud').innerHTML=
  '<b>state</b> <span id="st">'+state+'</span><br><b>shards</b> '+shards.length+
  '<br><b>dust</b> '+DUST+'<br><b>fps</b> <span id="fps">--</span>'; }

// ── tap versus drag ───────────────────────────────────────────────────
let down=null;
R.domElement.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY}; });
R.domElement.addEventListener('pointerup',e=>{
  if(!down||state!=='IDLE') { down=null; return; }
  const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y); down=null;
  if(moved<8) go();
});
function go(){
  state='RELEASE'; t0=performance.now()/1000;
  controls.enabled=false;
  document.getElementById('hint').classList.add('out');
  document.getElementById('again').classList.remove('show');
}
document.getElementById('again').addEventListener('click',()=>{
  bust.visible=true; bust.position.set(0,0,0); bust.rotation.set(0,0,0);
  group.visible=false; dm.opacity=0; cam.position.copy(CAM0); cam.lookAt(0,0,0);
  for(const s of shards){ s.m.position.copy(s.home); s.m.rotation.set(0,0,0); }
  controls.enabled=true; state='IDLE';
  document.getElementById('hint').classList.remove('out');
  document.getElementById('again').classList.remove('show');
});

let f=0,last=performance.now(); const clock=new THREE.Clock();
(function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05), now=performance.now()/1000, t=now-t0;

  if(state==='IDLE'&&bust){ bust.position.y=Math.sin(now*0.55)*0.006; bust.rotation.z=Math.sin(now*0.42)*0.0045; }

  if(state==='RELEASE'){                       // 0.00-0.10 tiny suspension release
    bust.position.y=0.012*Math.sin(t/0.10*Math.PI);
    if(t>=0.10){ state='FALLING'; }
  }
  else if(state==='FALLING'){                  // 0.10-0.65 gravity, camera follows then lags
    const ft=t-0.10, y=-0.5*13.5*ft*ft;
    bust.position.y=y; bust.rotation.z=ft*0.22;
    const follow=Math.max(y*0.55, FLOOR*0.55);   // lags behind by design
    cam.position.y=CAM0.y+follow; cam.lookAt(0,follow*0.8,0);
    if(y<=FLOOR){ fellTo=y; impact(); }
  }
  else if(state==='SHATTER'){
    const st=t-0.65;
    for(const s of shards){
      const lt=st-s.delay; if(lt<=0) continue;
      s.m.position.x=s.home.x+s.v.x*lt;
      s.m.position.y=s.home.y+s.v.y*lt-0.5*9.2*lt*lt;
      s.m.position.z=s.home.z+s.v.z*lt;
      s.m.rotation.x+=s.w.x*dt; s.m.rotation.y+=s.w.y*dt; s.m.rotation.z+=s.w.z*dt;
    }
    for(let i=0;i<DUST;i++){
      dp[i*3]+=dv[i*3]*dt; dp[i*3+1]+=dv[i*3+1]*dt; dp[i*3+2]+=dv[i*3+2]*dt;
      dv[i*3+1]-=2.4*dt; dv[i*3]*=0.985; dv[i*3+2]*=0.985;
    }
    dg.attributes.position.needsUpdate=true;
    dm.opacity=Math.max(0,0.9*(1-st/1.7));
    cam.position.y+=(CAM0.y-cam.position.y)*Math.min(1,dt*1.6);
    cam.lookAt(0,FLOOR*0.35,0);
    if(st>2.0){ state='COMPLETE'; document.getElementById('again').classList.add('show'); }
  }

  const st=document.getElementById('st'); if(st) st.textContent=state;
  controls.update(); R.render(scene,cam);
  f++; const p=performance.now();
  if(p-last>1000){const e=document.getElementById('fps'); if(e)e.textContent=Math.round(f*1000/(p-last)); f=0; last=p;}
})();

function impact(){
  state='SHATTER';
  bust.visible=false;
  group.position.set(0,fellTo,0); group.visible=true;
  for(const s of shards) s.home.copy(s.m.position);
  burst(0);
  cam.position.y-=0.045;                        // micro kick
}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>

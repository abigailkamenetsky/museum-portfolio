<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Marie &mdash; the sequence</title>
<style>
 *{box-sizing:border-box} html,body{margin:0;height:100%;background:#000;overflow:hidden}
 body{font-family:"Iowan Old Style",Palatino,Georgia,serif;touch-action:none}
 canvas{display:block;position:fixed;inset:0}
 .hint{position:fixed;left:0;right:0;bottom:11vh;text-align:center;z-index:2;color:#9a9188;
   font-size:clamp(13px,1.6vw,17px);letter-spacing:.16em;opacity:0;transition:opacity .9s}
 .hint.in{opacity:.85} .hint.out{opacity:0;transition:opacity .18s}
 .hud{position:fixed;left:14px;top:12px;z-index:3;color:#544d42;font-size:11px;line-height:1.75;
   font-family:ui-monospace,Menlo,monospace}
 .hud b{color:#8d7f5c;font-weight:400}
 #tl{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:9;display:flex;
   gap:9px;align-items:center;background:rgba(9,8,5,.9);border:1px solid #2b2419;border-radius:9px;
   padding:9px 13px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#c9a24e}
 #tl button{font:inherit;background:#171208;color:#c9a24e;border:1px solid #3d3524;border-radius:5px;
   padding:5px 9px;cursor:pointer}
 #tl button:hover{border-color:#c9a24e}
 #tl input{width:min(360px,46vw);accent-color:#c9a24e}
 #fn{min-width:96px;letter-spacing:.08em}
 .again{position:fixed;right:14px;top:12px;z-index:4;font-family:inherit;font-size:12px;
   letter-spacing:.1em;background:#171208;color:#c9a24e;border:1px solid #3d3524;border-radius:6px;
   padding:7px 13px;cursor:pointer;opacity:0;transition:opacity .5s;pointer-events:none}
 .again.show{opacity:1;pointer-events:auto}
</style></head><body>
<div class="hint" id="hint">tap to shatter</div>
<div class="hud" id="hud">loading&hellip;</div>
<button class="again" id="again">replay</button>
<script type="importmap">
{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../vendor/loaders/GLTFLoader.js';
import { DRACOLoader } from '../vendor/loaders/DRACOLoader.js';
import { OrbitControls } from '../vendor/controls/OrbitControls.js';

// abby-museum-marie-v1
let _seed=0x9E3779B9;
function rnd(){ _seed^=_seed<<13; _seed^=_seed>>>17; _seed^=_seed<<5; return ((_seed>>>0)/4294967296); }
const FPS=24, LAST=96, DUR=LAST/FPS;      // the 97-frame review grid

const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2)); R.setSize(innerWidth,innerHeight);
R.setClearColor(0x000000,1); R.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(R.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.012,80);
const CAM0=new THREE.Vector3(0,0.06,1.92); cam.position.copy(CAM0);

// point lights, not directional: she must fall AWAY from them and dim
const key=new THREE.PointLight(0xfff8ef, 7.0, 0, 2.0); key.position.set(-1.15,0.95,1.45); scene.add(key);
const fill=new THREE.PointLight(0xd8e4ff, 1.5, 0, 2.0); fill.position.set(1.45,0.30,1.05); scene.add(fill);
const rim=new THREE.PointLight(0xfff2dd, 4.0, 0, 2.0); rim.position.set(0.70,0.80,-1.45); scene.add(rim);
const amb=new THREE.AmbientLight(0x2a2b31,0.55); scene.add(amb);
// a pool of light waiting on the floor: it grows as she nears it
const glow=new THREE.PointLight(0xffd9a8, 0.0, 3.2, 2.0);
glow.position.set(0,-0.86,0.25); scene.add(glow);
const marble=new THREE.MeshPhysicalMaterial({color:0xdcd8d1,roughness:0.46,vertexColors:true,sheen:0.24});
const marble2=new THREE.MeshStandardMaterial({color:0xdcd8d1,roughness:0.48});

const controls=new OrbitControls(cam,R.domElement);
controls.enableDamping=true; controls.dampingFactor=0.075; controls.enablePan=false;
controls.enableZoom=false; controls.rotateSpeed=0.6;
controls.minPolarAngle=Math.PI*0.30; controls.maxPolarAngle=Math.PI*0.70;

// soft round sprite, drawn once. untextured points are hard squares, which
// is exactly why the dust read as white confetti.
function puff(inner, outer){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d');
  const grd=g.createRadialGradient(32,32,0,32,32,32);
  grd.addColorStop(0,inner); grd.addColorStop(0.35,outer); grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grd; g.fillRect(0,0,64,64);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const TEX_DUST=puff('rgba(240,232,214,0.55)','rgba(214,200,176,0.18)');
const TEX_MOTE=puff('rgba(226,220,206,0.42)','rgba(180,172,155,0.10)');

// ── speed streaks: the void has nothing to blur, so rush motes past the lens ──
const NS=1500;
const sg=new THREE.BufferGeometry();
const sp=new Float32Array(NS*3);
for(let i=0;i<NS;i++){
  const a=rnd()*Math.PI*2, r=0.30+rnd()*2.2;
  sp[i*3]=Math.cos(a)*r; sp[i*3+1]=(rnd()-0.5)*4.0; sp[i*3+2]=Math.sin(a)*r-0.1;
}
sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
const sm=new THREE.PointsMaterial({map:TEX_MOTE,size:0.030,transparent:true,opacity:0,
  depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});
const streakPts=new THREE.Points(sg,sm); scene.add(streakPts);
function streaks(dt,k,y){
  sm.opacity=0.30+0.55*k;
  streakPts.position.y=y;                 // travel with the camera
  for(let i=0;i<NS;i++){
    sp[i*3+1]+=(9.0+k*30)*dt;             // rush upward past the lens
    if(sp[i*3+1]>1.7){ sp[i*3+1]=-1.7;
      const a=rnd()*Math.PI*2, r=0.25+rnd()*1.5;
      sp[i*3]=Math.cos(a)*r; sp[i*3+2]=Math.sin(a)*r-0.2; }
  }
  sg.attributes.position.needsUpdate=true;
  sm.size=0.026+0.055*k;
}

// ── dust: cheap additive sprites, thousands of them cost nothing ──────
const DUST=1600;
const dg=new THREE.BufferGeometry();
const dp=new Float32Array(DUST*3), dv=new Float32Array(DUST*3), dh=new Float32Array(DUST*3), dl=new Float32Array(DUST);
dg.setAttribute('position',new THREE.BufferAttribute(dp,3));
const dm=new THREE.PointsMaterial({map:TEX_DUST,size:0.055,transparent:true,opacity:0,
  depthWrite:false,blending:THREE.NormalBlending,sizeAttenuation:true});
const dust=new THREE.Points(dg,dm); dust.renderOrder=-1; scene.add(dust);
function burst(y){
  for(let i=0;i<DUST;i++){
    const a=rnd()*Math.PI*2, r=rnd()**0.6*0.13;
    dh[i*3]=Math.cos(a)*r; dh[i*3+1]=y+rnd()*0.04; dh[i*3+2]=Math.sin(a)*r;
    dp[i*3]=dh[i*3]; dp[i*3+1]=dh[i*3+1]; dp[i*3+2]=dh[i*3+2];
    // low and wide first, the way a real impact throws a skirt of dust
    const sp2=0.6+rnd()*2.2;
    dv[i*3]=Math.cos(a)*sp2; dv[i*3+1]=0.08+rnd()*0.85; dv[i*3+2]=Math.sin(a)*sp2;
    dl[i]=0.6+rnd()*0.9;
  }
  dg.attributes.position.needsUpdate=true; dm.opacity=0.30; dm.size=0.05;
}

let bust=null, shards=[], group=null, state='LOADING', t0=0, fellTo=0;
let camY=CAM0.y, INTACT_H=1;
const FLOOR=-0.62;
const draco=new DRACOLoader(); draco.setDecoderPath('../vendor/draco/');
const L=new GLTFLoader(); L.setDRACOLoader(draco);

L.load('./intact.glb',(g)=>{
  g.scene.traverse(o=>{ if(o.isMesh) o.material=marble; });
  const b=new THREE.Box3().setFromObject(g.scene), c=new THREE.Vector3(); b.getCenter(c);
  g.scene.position.sub(c);
  bust=new THREE.Group(); bust.add(g.scene); scene.add(bust);
  const bs=new THREE.Vector3(); b.getSize(bs); INTACT_H=bs.y;
  L.load('./shards.glb',(s)=>{
    const b2=new THREE.Box3().setFromObject(s.scene), c2=new THREE.Vector3(); b2.getCenter(c2);
    s.scene.position.sub(c2);
    group=new THREE.Group(); group.add(s.scene); group.visible=false; scene.add(group);
    // the shard export came through a different pipeline; match it to the bust
    const s2=new THREE.Vector3(); b2.getSize(s2);
    const fit = s2.y > 1e-6 ? INTACT_H / s2.y : 1;
    group.scale.setScalar(fit);
    console.log('shard fit scale', fit.toFixed(4));
    s.scene.traverse(o=>{
      if(!o.isMesh) return; o.material=marble2;
      const wp=new THREE.Vector3(); o.getWorldPosition(wp);
      const d=wp.clone().sub(group.position); if(d.length()<1e-5) d.set(rnd()-.5,rnd()-.5,rnd()-.5);
      d.normalize();
      const hero=/^hero/i.test(o.name);
      // heroes are art-directed toward the camera; the rest is constrained randomness
      // heroes are aimed straight past the lens so they wipe the frame;
      // roughly half the debris follows them, the rest scatters and falls
      const toCam = hero || rnd() < 0.55;
      const v = hero
        ? new THREE.Vector3((rnd()-.5)*2.6, 0.9+rnd()*1.5, 4.6+rnd()*3.0)
        : toCam
          ? new THREE.Vector3(d.x*(1.1+rnd()*2.2), 0.7+rnd()*2.0, 2.6+rnd()*4.4)
          : new THREE.Vector3(d.x*(1.4+rnd()*2.6), 1.0+rnd()*2.4, d.z*(0.8+rnd()*1.6)-0.4);
      shards.push({m:o, dir:d.clone(), vel:v.clone(), rest:false, home:o.position.clone(), v, hero,
        w:new THREE.Vector3((rnd()-.5)*7.5,(rnd()-.5)*7.5,(rnd()-.5)*7.5),
        delay: hero ? 0 : rnd()*0.16});          // staggered, not one frame
    });
    state='IDLE'; document.getElementById('hint').classList.add('in');
    hud();
  });
});
function hud(){ document.getElementById('hud').innerHTML=
  '<b>state</b> <span id="st">'+state+'</span><br><b>shards</b> '+shards.length+
  '<br><b>dust</b> '+DUST+'<br><b>fps</b> <span id="fps">--</span>'; }

// ── tap versus drag ───────────────────────────────────────────────────
let down=null;
R.domElement.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY}; });
R.domElement.addEventListener('pointerup',e=>{
  if(!down||state!=='IDLE') { down=null; return; }
  const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y); down=null;
  if(moved<8) go();
});
function go(){
  state='PLAY'; T=0; playing=true; controls.enabled=false;
  if(!ui.fn) buildUI();
  ui.pp.textContent='pause';
  burst(0);
  document.getElementById('hint').classList.add('out');
  document.getElementById('again').classList.remove('show');
}
document.getElementById('again').addEventListener('click',()=>{
  playing=false; T=0; if(ui.fn) sync();
  bust.visible=true; bust.position.set(0,0,0); bust.rotation.set(0,0,0);
  group.visible=false; dm.opacity=0; sm.opacity=0; glow.intensity=0;
  cam.position.copy(CAM0); camY=CAM0.y; cam.position.x=0; cam.lookAt(0,0,0);
  for(const s of shards){ s.m.position.copy(s.home); s.m.rotation.set(0,0,0);
    s.rest=false; s.vel.copy(s.v); s.w.set((rnd()-.5)*7.5,(rnd()-.5)*7.5,(rnd()-.5)*7.5); }
  controls.enabled=true; state='IDLE';
  document.getElementById('hint').classList.remove('out');
  document.getElementById('again').classList.remove('show');
});

// ── the shot as a pure function of frame ────────────────────────────────
// nothing integrates. every element is evaluated from T, which is what makes
// the timeline scrubbable and what lets us author poses instead of tuning
// initial velocities and hoping.
const K = {                       // art-direction checkpoints, in frames
  release:[0,2], fall:[2,29], impact:29, seams:[30,37], burst:[37,55], settle:[55,96]
};
const fr = n => n/FPS;
const span = (T,a,b) => Math.min(1, Math.max(0, (T-fr(a))/(fr(b)-fr(a))));
const ease = x => x<0.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;

function renderAt(T){
  const yFall = t => -0.5*13.5*t*t;
  if(T < fr(K.impact)){                                  // FALL
    bust.visible=true; group.visible=false;
    const rel=span(T,K.release[0],K.release[1]);
    const ft=Math.max(0,T-fr(K.fall[0]));
    const y = T<fr(K.fall[0]) ? 0.012*Math.sin(rel*Math.PI) : Math.max(FLOOR, yFall(ft));
    bust.position.y=y; bust.rotation.z=ft*0.30; bust.rotation.x=ft*0.16;
    const k=Math.min(1,(-y)/Math.abs(FLOOR));
    // the camera is keyframed: follows, then brakes, then lets her outrun it
    const lag = k<0.72 ? 0.96 : 0.96-(k-0.72)/0.28*0.34;
    cam.position.set(Math.sin(T*38)*0.006*k, CAM0.y+y*lag, CAM0.z-k*0.22);
    cam.lookAt(0,y+0.02,0);
    glow.intensity=k*k*9.0;
    sm.opacity=0.30+0.55*k; sm.size=0.026+0.055*k;
    dm.opacity=0;
    return;
  }
  // ── IMPACT ONWARD ──────────────────────────────────────────────────────
  // the shards do not seal when assembled, so the intact mesh covers the
  // first frames and hands over once separation hides the seams
  const HANDOFF=34;
  const cross=span(T,K.impact,HANDOFF);
  // hard switch, never both: overlapping them showed shard cut faces
  // as flat planes across her surface
  bust.visible = cross<1;
  group.visible = !bust.visible;
  if(bust.visible){ bust.position.y=FLOOR; bust.rotation.z=0.30*(fr(K.impact)-fr(K.fall[0])); }
  group.position.set(0,FLOOR,0);
  const st=T-fr(K.impact);
  const reveal=cross;
  // seams open before anything flies: the eye must see it come apart
  const seam=ease(span(T,K.impact,K.seams[1]));
  const out =ease(span(T,K.burst[0],K.burst[1]));
  for(const s of shards){
    const d=s.delay*0.5;
    const sSeam=Math.max(0,Math.min(1,(seam-d)/(1-d||1)));
    const sOut =Math.max(0,Math.min(1,(out -d)/(1-d||1)));
    const lt=sOut*1.35;
    s.m.position.copy(s.home)
      .addScaledVector(s.dir, 0.045+sSeam*0.070)           // already parted at handover
      .addScaledVector(s.v, lt);
    s.m.position.y -= 0.5*3.0*lt*lt;
    if(s.vel.z<1.2 && s.m.position.y < -0.18) s.m.position.y=-0.18;
    s.m.rotation.set(s.w.x*lt*0.9, s.w.y*lt*0.9, s.w.z*lt*0.9);
  }
  // dust is keyed, not emitted
  const dgrow=span(T,29,34), dfade=span(T,39,58);
  dm.opacity=0.34*dgrow*(1-dfade*0.92);
  dm.size=0.05+dgrow*0.05+dfade*0.09;
  for(let i=0;i<DUST;i++){
    const t2=Math.max(0,st);
    dp[i*3]=dh[i*3]+dv[i*3]*t2*0.55;
    dp[i*3+1]=dh[i*3+1]+dv[i*3+1]*t2-0.5*0.9*t2*t2;
    dp[i*3+2]=dh[i*3+2]+dv[i*3+2]*t2*0.55;
  }
  dg.attributes.position.needsUpdate=true;
  sm.opacity=Math.max(0,0.85*(1-span(T,29,32)));
  glow.intensity=14*(1-span(T,29,33))+2.2*span(T,29,33);
  const cy=CAM0.y+FLOOR*0.86, cz=CAM0.z-0.10;
  const rec=ease(span(T,29,36));
  cam.position.set(0, (CAM0.y+FLOOR*0.96)*(1-rec)+cy*rec - 0.05*(1-span(T,29,31)), CAM0.z*(1-rec)+cz*rec);
  cam.lookAt(0,FLOOR+0.04,0);
}

// ── playback and the review scrubber ───────────────────────────────────
let playing=false, T=0, f=0,last=performance.now();
const clock=new THREE.Clock();
const ui={};
function buildUI(){
  const d=document.createElement('div'); d.id='tl';
  d.innerHTML='<button id="pp">play</button>'+
    '<button id="pv">&#9664;</button><button id="nx">&#9654;</button>'+
    '<span id="fn">FRAME 0 / 96</span>'+
    '<input type="range" id="sc" min="0" max="96" step="1" value="0">'+
    '<button id="rs">reset</button>';
  document.body.appendChild(d);
  ui.fn=d.querySelector('#fn'); ui.sc=d.querySelector('#sc'); ui.pp=d.querySelector('#pp');
  ui.sc.addEventListener('input',()=>{ playing=false; ui.pp.textContent='play'; T=+ui.sc.value/FPS; sync(); });
  ui.pp.addEventListener('click',()=>{ playing=!playing; ui.pp.textContent=playing?'pause':'play'; if(T>=DUR)T=0; });
  d.querySelector('#pv').addEventListener('click',()=>{ playing=false; ui.pp.textContent='play'; T=Math.max(0,T-1/FPS); sync(); });
  d.querySelector('#nx').addEventListener('click',()=>{ playing=false; ui.pp.textContent='play'; T=Math.min(DUR,T+1/FPS); sync(); });
  d.querySelector('#rs').addEventListener('click',()=>{ playing=false; ui.pp.textContent='play'; T=0; sync(); });
}
function sync(){ const n=Math.round(T*FPS); ui.fn.textContent='FRAME '+n+' / '+LAST; ui.sc.value=n; renderAt(T); }

(function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05);
  if(state==='IDLE'&&bust){ const n=performance.now()/1000;
    bust.position.y=Math.sin(n*0.55)*0.006; bust.rotation.z=Math.sin(n*0.42)*0.0045; }
  else if(state==='PLAY'){
    if(playing){ T+=dt; if(T>=DUR){ T=DUR; playing=false; if(ui.pp)ui.pp.textContent='play';
      document.getElementById('again').classList.add('show'); } sync(); }
  }
  const stEl=document.getElementById('st'); if(stEl) stEl.textContent=state;
  controls.update(); R.render(scene,cam);
  f++; const p=performance.now();
  if(p-last>1000){const e=document.getElementById('fps'); if(e)e.textContent=Math.round(f*1000/(p-last)); f=0; last=p;}
})();

function impact(){
  state='SHATTER';
  bust.visible=false;
  group.position.set(0,fellTo,0); group.visible=true;
  burst(0);
  cam.position.y-=0.05; camY=cam.position.y; glow.intensity=14;   // micro kick + flash
}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>

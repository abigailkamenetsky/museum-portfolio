<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Marie &mdash; milestone 1</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
       -webkit-font-smoothing:antialiased;touch-action:none}
  canvas{display:block;position:fixed;inset:0}
  .hint{position:fixed;left:0;right:0;bottom:12vh;text-align:center;z-index:2;
    color:#9a9188;font-size:clamp(13px,1.6vw,17px);letter-spacing:.16em;
    opacity:0;transition:opacity 1.1s ease;pointer-events:none}
  .hint.in{opacity:.82}
  .load{position:fixed;left:0;right:0;bottom:12vh;text-align:center;z-index:2;
    color:#4a453e;font-size:12px;letter-spacing:.24em}
  .hud{position:fixed;left:14px;top:12px;z-index:3;color:#4e4840;font-size:11px;
    line-height:1.7;font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em}
  .hud b{color:#8a7f6d;font-weight:400}
  @media (prefers-reduced-motion:reduce){.hint{transition:none}}
</style>
</head>
<body>
<div class="load" id="load">LOADING</div>
<div class="hint" id="hint">drag to examine &middot; tap does nothing yet</div>
<div class="hud" id="hud"></div>

<script type="importmap">
{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';
import { DRACOLoader } from './vendor/loaders/DRACOLoader.js';
import { OrbitControls } from './vendor/controls/OrbitControls.js';

const hud = document.getElementById('hud');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 60);
camera.position.set(0, 0.06, 1.92);

// the three lights from the Blender look: soft key upper left, cool dim fill
// opposite, low rim behind for separation. no environment, no floor.
const key = new THREE.DirectionalLight(0xfff8ef, 2.5);
key.position.set(-1.35, 1.15, 1.55); scene.add(key);
const fill = new THREE.DirectionalLight(0xd8e4ff, 0.42);
fill.position.set(1.55, 0.18, 0.95); scene.add(fill);
const rim = new THREE.DirectionalLight(0xfff2dd, 1.15);
rim.position.set(0.75, 0.85, -1.6); scene.add(rim);
scene.add(new THREE.AmbientLight(0x2a2b30, 0.55));

const marble = new THREE.MeshPhysicalMaterial({
  color: 0xdad6cf, roughness: 0.44, metalness: 0.0,
  clearcoat: 0.10, clearcoatRoughness: 0.7,
  sheen: 0.22, sheenColor: new THREE.Color(0xfffaf0), sheenRoughness: 0.9,
});

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.075;
controls.enablePan = false; controls.enableZoom = false;
controls.rotateSpeed = 0.62;
controls.minPolarAngle = Math.PI*0.30; controls.maxPolarAngle = Math.PI*0.70;
controls.target.set(0, 0.02, 0);

let bust = null, t0 = performance.now();
const draco = new DRACOLoader(); draco.setDecoderPath('./vendor/draco/');
const loader = new GLTFLoader(); loader.setDRACOLoader(draco);

loader.load('./marie.glb', (gltf) => {
  const load = performance.now() - t0;
  let tris = 0, verts = 0;
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    o.material = marble; o.castShadow = false; o.receiveShadow = false;
    const g = o.geometry; g.computeVertexNormals();
    verts += g.attributes.position.count;
    tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
  });
  const box = new THREE.Box3().setFromObject(gltf.scene);
  const size = new THREE.Vector3(); box.getSize(size);
  const centre = new THREE.Vector3(); box.getCenter(centre);
  gltf.scene.position.sub(centre);
  bust = new THREE.Group(); bust.add(gltf.scene); scene.add(bust);

  document.getElementById('load').remove();
  requestAnimationFrame(()=>document.getElementById('hint').classList.add('in'));
  hud.innerHTML = '<b>triangles</b> '+Math.round(tris).toLocaleString()+
    '<br><b>vertices</b> '+verts.toLocaleString()+
    '<br><b>glb</b> 0.71 MB draco'+
    '<br><b>load+decode</b> '+Math.round(load)+' ms'+
    '<br><b>fps</b> <span id="fps">--</span>';
}, undefined, (e) => { document.getElementById('load').textContent = 'FAILED: '+e; });

let frames = 0, last = performance.now();
const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  if (bust) {                       // barely-there idle drift
    bust.position.y = Math.sin(t*0.55)*0.006;
    bust.rotation.z = Math.sin(t*0.42)*0.0045;
  }
  controls.update();
  renderer.render(scene, camera);
  frames++;
  const now = performance.now();
  if (now - last > 1000) {
    const el = document.getElementById('fps');
    if (el) el.textContent = Math.round(frames*1000/(now-last));
    frames = 0; last = now;
  }
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>

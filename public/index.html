<script>
/* The front door costs 40KB. Everything the statue needs costs 4.8MB, and it
   was all being fetched before the visitor had chosen anything, so a phone on
   a weak signal sat on a black screen for half a minute and someone who only
   wanted the one page summary paid for a statue they never saw.

   Nothing heavy is referenced by this document any more. Choosing the museum
   is what fetches it. This is a classic script on purpose: it must run without
   waiting on the module graph. */
(function(){
  var gate = document.getElementById('gate');
  var hint = document.getElementById('hint');
  var dv   = document.getElementById('dustvid');
  var q    = new URLSearchParams(location.search);
  var auto = q.has('auto'), dev = q.has('dev');
  var started = false;

  function pull(){
    if (started) return; started = true;
    // Warm the three hops the module will make, now that they are wanted.
    ['/marie/vendor/three.module.js','/marie/vendor/three.core.js'].forEach(function(u){
      var l = document.createElement('link'); l.rel='modulepreload'; l.href=u;
      document.head.appendChild(l);
    });
    var w = document.createElement('link');
    w.rel='preload'; w.as='fetch'; w.crossOrigin='anonymous';
    w.href='/marie/vendor/draco/draco_decoder.wasm';
    document.head.appendChild(w);

    if (hint) { hint.textContent = 'preparing the gallery…'; hint.classList.add('in'); }
    import('/marie/intro/shot.js').catch(function(e){
      // If the module cannot load there is still a museum to send her to,
      // rather than a black screen with a dead button.
      if (hint) hint.textContent = 'opening the museum…';
      location.href = '/preview/';
    });
  }

  function choose(){
    // Set the source and spend this gesture on the video here: iOS will not
    // buffer or play a clip unless play() is called inside a user gesture.
    try {
      // Unlock the element with a 1.6KB stub rather than the 1.2MB dust clip.
      // iOS grants playback per element inside a gesture and keeps it across a
      // later src change, so the real clip can arrive once the statue is up
      // instead of racing it for the connection.
      if (!dv.getAttribute('src')) dv.src = '/marie/intro/unlock.mp4';
      var p = dv.play();
      if (p && p.then) p.then(function(){ dv.pause(); dv.currentTime = 0; }).catch(function(){});
    } catch(_) {}
    if (gate) {
      gate.classList.add('out');
      setTimeout(function(){ if (gate && gate.parentNode) gate.parentNode.removeChild(gate); }, 460);
    }
    pull();
  }

  if (auto || dev) { if (gate && gate.parentNode) gate.parentNode.removeChild(gate); pull(); return; }

  var btn = document.getElementById('gmuseum');
  if (btn) {
    btn.addEventListener('click', choose);
    // Reaching for the button is enough of a signal to start fetching. On a
    // pointer this buys the whole hover; on a touch screen touchstart still
    // lands before the click. Someone heading for the summary never triggers
    // it, so it stays free for them.
    var warmed = false;
    function warm(){
      if (warmed) return; warmed = true;
      // modulepreload, not prefetch. Measured over three runs each on a slow
      // line, prefetch made it 550ms SLOWER: it is low priority, the later
      // import() does not reuse it, and the two then compete for the
      // connection. modulepreload is fetched at the priority a module
      // deserves and the import picks it straight out of the module map.
      ['/marie/vendor/three.module.js','/marie/vendor/three.core.js','/marie/intro/shot.js']
        .forEach(function(u){
          var l = document.createElement('link');
          l.rel = 'modulepreload'; l.href = u;
          document.head.appendChild(l);
        });
    }
    btn.addEventListener('pointerenter', warm, {passive:true});
    btn.addEventListener('touchstart', warm, {passive:true});
    requestAnimationFrame(function(){
      try { btn.focus(); } catch(_) {}
      // Only after the opening focus, or this page focuses the button itself
      // on load and warms for everyone, including the summary readers.
      btn.addEventListener('focus', warm);
    });
  } else {
    pull();   // no chooser in the document for some reason: behave as before
  }
})();
</script>
